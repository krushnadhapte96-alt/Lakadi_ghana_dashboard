server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the API's multipart limit so uploads do not 413 at the edge.
    client_max_body_size 55m;

    # The PWA is a single-page app: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API; the upstream is the api service from docker-compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The notification bell holds an SSE stream open for 30 minutes.
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # Cache built assets aggressively, but never cache the app shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
